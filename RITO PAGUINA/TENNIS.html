<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Del Barrio - Ubicaciones y Contacto</title>
  
  <!-- FontAwesome e Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px 80px 20px;
      
      /* FONDO INTEGRADO CON TU IMAGEN DE GRAFFITI */
      background-image: url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* LOGO REDONDO CON TU IMAGEN LOCAL */
    .logo-container {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 6px solid #111;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      overflow: hidden;
      background-color: #e2d9cd;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TARJETA PRINCIPAL AMARILLA */
    .card {
      width: 100%;
      background-color: #ffdf00; /* Amarillo brillante fiel a la imagen original */
      border-radius: 30px;
      padding: 35px 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* FILAS DE LOS DÍAS */
    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .day-title {
      font-size: 26px;
      font-weight: 900;
      color: #000;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* BOTONES DE UBICACIÓN */
    .btn-ubicacion {
      background-color: #1b00b2; /* Azul/Morado profundo */
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(27, 0, 178, 0.4);
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ubicacion:hover {
      background-color: #0d0066;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(27, 0, 178, 0.6);
    }

    .btn-ubicacion:active {
      transform: translateY(0);
    }

    /* APARTADO DE WHATSAPP DENTRO DE LA TARJETA */
    .whatsapp-card-section {
      margin-top: 10px;
      padding-top: 20px;
      border-top: 3px dashed #111;
      text-align: center;
    }

    .btn-whatsapp-card {
      background-color: #25d366;
      color: #fff;
      padding: 14px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.5);
      transition: all 0.2s ease-in-out;
    }

    .btn-whatsapp-card:hover {
      background-color: #1da851;
      transform: scale(1.02);
    }

    /* BOTÓN FLOTANTE DE WHATSAPP */
    .btn-whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
      text-decoration: none;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .btn-whatsapp-float:hover {
      transform: scale(1.1);
      background-color: #1da851;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ETIQUETA DEL LOGO -->
    <div class="logo-container">
      <img src="logo.jpg" alt="Tennis Del Barrio Logo" class="logo-img">
    </div>

    <!-- TARJETA DE DÍAS Y UBICACIONES -->
    <div class="card">
      
      <!-- JUEVES -->
      <div class="day-row">
        <span class="day-title">JUEVES</span>
        <a href="#" class="btn-ubicacion" id="btn-jueves" target="_blank">
          UBICACION
        </a>
      </div>

      <!-- VIERNES -->
      <div class="day-row">
        <span class="day-title">VIERNES</span>
        <a href="#" class="btn-ubicacion" id="btn-viernes" target="_blank">
          UBICACION
        </a>
      </div>

      <!-- SÁBADO -->
      <div class="day-row">
        <span class="day-title">SABADO</span>
        <a href="#" class="btn-ubicacion" id="btn-sabado" target="_blank">
          UBICACION
        </a>
      </div>

      <!-- DOMINGO -->
      <div class="day-row">
        <span class="day-title">DOMINGO</span>
        <a href="#" class="btn-ubicacion" id="btn-domingo" target="_blank">
          UBICACION
        </a>
      </div>

      <!-- APARTADO DIRECTO DE WHATSAPP -->
      <div class="whatsapp-card-section">
        <a href="#" id="btn-whatsapp" class="btn-whatsapp-card" target="_blank">
          <i class="fa-brands fa-whatsapp" style="font-size: 22px;"></i>
          PEDIDOS POR WHATSAPP
        </a>
      </div>

    </div>

  </div>

  <!-- BOTÓN FLOTANTE DE WHATSAPP -->
  <a href="#" id="btn-whatsapp-float" class="btn-whatsapp-float" target="_blank" title="Contactar por WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script>
    // 1. REEMPLAZA AQUÍ TU NÚMERO DE WHATSAPP (con código de país, ej. 524481201482)
    const numeroTelefono = "524481201482"; 
    const mensajeWhatsApp = encodeURIComponent("¡Hola Tennis Del Barrio! Me interesan unos tenis, ¿me das información?");
    const urlWhatsApp = `https://wa.me/${numeroTelefono}?text=${mensajeWhatsApp}`;

    document.getElementById('btn-whatsapp').href = urlWhatsApp;
    document.getElementById('btn-whatsapp-float').href = urlWhatsApp;

    // 2. CONFIGURACIÓN DE LAS UBICACIONES EN GOOGLE MAPS
    const ubicaciones = {
      jueves: "https://www.google.com/maps/search/?api=1&query=Tianguis+Polanco+CDMX",
      viernes: "https://www.google.com/maps/search/?api=1&query=Centro+Historico+CDMX",
      sabado: "https://www.google.com/maps/search/?api=1&query=Tepito+CDMX",
      domingo: "https://www.google.com/maps/search/?api=1&query=La+Lagunilla+CDMX"
    };

    document.getElementById('btn-jueves').href = ubicaciones.jueves;
    document.getElementById('btn-viernes').href = ubicaciones.viernes;
    document.getElementById('btn-sabado').href = ubicaciones.sabado;
    document.getElementById('btn-domingo').href = ubicaciones.domingo;
  </script>

</body>
</html>
